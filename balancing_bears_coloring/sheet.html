<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: letter; margin: 0.3in; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif; color: #000; }
  .header { text-align: center; padding: 0 0 4px; }
  .header h1 { font-size: 24px; margin: 0; letter-spacing: 0.5px; }
  .header p { font-size: 14px; margin: 3px 0 0; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    gap: 8px;
    height: 9.55in;
  }
  .cell {
    border: 3px solid #000;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 6px;
    min-height: 0;
    overflow: hidden;
  }
  .cell img {
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    object-fit: contain;
  }
  .label {
    border: 4px solid #000;
    border-radius: 14px;
    padding: 2px 30px;
    font-size: 22px;
  }
</style>
</head>
<body>
<div class="header">
  <h1>Balancing Bears — Pattern Animals</h1>
  <p>Color your own patterns on each animal: stripes, spots, zigzags, spirals — anything you can imagine!</p>
</div>
<div class="grid">
  <div class="cell"><img src="img_clean/frog.png"></div>
  <div class="cell"><img src="img_clean/zebra.png"></div>
  <div class="cell"><img src="img_clean/butterfly.png"></div>
  <div class="cell"><img src="img_clean/snake.png"></div>
</div>
</body>
</html>
